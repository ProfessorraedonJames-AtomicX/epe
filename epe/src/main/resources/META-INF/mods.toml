displayName="Euphoria Pacing Extended"
authors="AtomicX"
logoFile="euphoria_logo.png"
logoBlur=false
credits="Original code by AtomicX"
description='''Euphoria Pacing Extended (EPE): client-side rendering and frame-pacing optimizer for low-end hardware.

- EPE chunk draw-list engine: custom zero-allocation draw builder for SectionRenderDispatcher.
- Adaptive block entity culling: eliminates storage room and mob farm frame drops.
- Dynamic quality governor: strict hysteresis and VSync-aware scaling.
- Smoother chunk loading: time-budgeted mesh uploads and proximity-aware rebuilds.
- Smart particle culling and per-tick burst cap.
- Frame stats (avg FPS, 1% low, worst frame) logged every 10 seconds.
- Full Sodium / Embeddium co-existence.
'''

